const AppState = { isLoggedIn: false, user: null, mySkills: [] };

function loadState() {
  try { var s = localStorage.getItem('ebskill_state'); if (s) { var d = JSON.parse(s); AppState.isLoggedIn = d.isLoggedIn||false; AppState.user = d.user||null; AppState.mySkills = d.mySkills||[]; } } catch(e) {}
}
function saveState() {
  try { localStorage.setItem('ebskill_state', JSON.stringify({ isLoggedIn: AppState.isLoggedIn, user: AppState.user, mySkills: AppState.mySkills })); } catch(e) {}
}

function getRoute() { return window.location.hash.slice(1)||'home'; }
function navigate(hash) { window.location.hash = hash; }

function router() {
  var hash=getRoute(), app=document.getElementById('app');
  window.scrollTo(0,0); updateNavActive(hash);
  if (hash==='home'||hash==='') renderHomePage(app);
  else if (hash==='register') renderRegisterPage(app);
  else if (hash==='login') renderLoginPage(app);
  else if (hash==='create') renderCreatePage(app);
  else if (hash==='my-skills') renderMySkillsPage(app);
  else if (hash==='tutorial') renderTutorialPage(app);
  else if (hash.startsWith('role/')) renderRolePage(app, hash.replace('role/',''));
  else renderHomePage(app);
}
window.addEventListener('hashchange', router);

// 绑定筛选标签事件
function bindFilterTags() {
  document.querySelectorAll('.scene-tag').forEach(function(tag) {
    tag.addEventListener('click', function() {
      var category=tag.dataset.category, grid=document.getElementById('skillsGrid');
      if (!grid) return;
      var filtered=category==='all'?CLAWHUB_SKILLS:CLAWHUB_SKILLS.filter(function(s){return s.category===category;});
      grid.innerHTML=filtered.map(function(s,i){return renderSkillCard(s,i);}).join('');
      document.querySelectorAll('.scene-tag').forEach(function(t) {
        var isActive=t.dataset.category===category;
        t.classList.toggle('bg-brand-500',isActive);t.classList.toggle('text-white',isActive);t.classList.toggle('shadow-sm',isActive);
        t.classList.toggle('text-gray-600',!isActive);t.classList.toggle('bg-white',!isActive);t.classList.toggle('border',!isActive);t.classList.toggle('border-gray-200',!isActive);
      });
    });
  });
}

function updateRegSteps(current) {
  document.querySelectorAll('#regSteps .step-indicator').forEach(function(el){var step=parseInt(el.dataset.step);el.classList.remove('active','done','bg-gray-200','text-gray-500');

  else if(step===current){el.classList.add('active');el.textContent=step;}else{el.classList.add('bg-gray-200','text-gray-500');el.textContent=step;}});
}
function regGoStep2(){var email=document.getElementById('regEmail').value.trim(),error=document.getElementById('regEmailError');if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){error.classList.remove('hidden');return;}error.classList.add('hidden');regEmail=email;document.getElementById('regEmailDisplay').textContent=email;document.getElementById('regStep1').classList.add('hidden');document.getElementById('regStep2').classList.remove('hidden');updateRegSteps(2);}

function checkPasswordStrength(){var pwd=document.getElementById('regPassword').value,bar=document.getElementById('strengthBar'),text=document.getElementById('strengthText'),s=0;if(pwd.length>=8)s++;if(/[a-z]/.test(pwd)&&/[A-Z]/.test(pwd))s++;if(/\d/.test(pwd))s++;if(/[^a-zA-Z0-9]/.test(pwd))s++;var levels=[{w:'0%',c:'#e5e7eb',t:'请输入密码'},{w:'25%',c:'#ef4444',t:'弱'},{w:'50%',c:'#f59e0b',t:'中等'},{w:'75%',c:'#3b82f6',t:'强'},{w:'100%',c:'#10b981',t:'非常强'}];var l=levels[s];bar.style.width=l.w;bar.style.backgroundColor=l.c;text.textContent=l.t;text.style.color=l.c;}

function selectCreateMode(mode){createMode=mode;refreshCreateContent();}
function refreshCreateContent(){document.getElementById('createContent').innerHTML=getCreateStepHTML();updateCreateSteps(createStep);}
function createGoStep2(){createStep=2;refreshCreateContent();}
function createGoStep3(){if(createMode==='upload'){var name=document.getElementById('createName').value.trim();var desc=document.getElementById('createDesc').value.trim();if(!name||!desc){alert('请填写技能名称和描述');return;}}createStep=3;refreshCreateContent();}
function addCreateTag(){var input=document.getElementById('createTagInput'),tag=input.value.trim();if(tag&&createTags.indexOf(tag)===-1&&createTags.length<5){createTags.push(tag);input.value='';renderCreateTags();}}
function removeCreateTag(idx){createTags.splice(idx,1);renderCreateTags();}
function renderCreateTags(){var el=document.getElementById('createTagsDisplay');if(!el)return;el.innerHTML=createTags.map(function(t,i){return '<span class="inline-flex items-center gap-1 px-2.5 py-1 bg-brand-50 text-brand-600 text-xs rounded-lg">'+t+'<button onclick="removeCreateTag('+i+')" class="hover:text-red-500">&times;</button></span>';}).join('');}
function handleFileSelect(input){if(input.files.length>0){uploadedFile=input.files[0];showFileName(uploadedFile.name);}}
function handleFileDrop(e){if(e.dataTransfer.files.length>0){uploadedFile=e.dataTransfer.files[0];showFileName(uploadedFile.name);}}
function showFileName(name){var el=document.getElementById('fileName');if(el){el.textContent=name;el.classList.remove('hidden');}}
function createSubmit(){var name=document.getElementById('createName').value.trim();var desc=document.getElementById('createDesc').value.trim();var roleId=document.getElementById('createRole').value;AppState.mySkills.push({id:Date.now(),name:name,desc:desc,role:roleId,tags:createTags.slice(),status:'published',createdAt:new Date().toISOString()});saveState();createStep=4;refreshCreateContent();}
